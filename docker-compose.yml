version: '3.8'

services:
  api:
    build:
      context: .
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3001:3001'
    command: npm run start:dev
    env_file:
      - .env
    depends_on:
      - postgres
    environment:
      - NODE_ENV=development
    networks:
      - backend

  postgres:
    image: postgres:14
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_A7d1ascWixJl
      POSTGRES_DB: neondb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend: 